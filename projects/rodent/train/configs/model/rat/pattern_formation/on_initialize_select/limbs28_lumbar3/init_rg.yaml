# @package model.pattern_formation.on_initialize_select
# Initialize and constrain PF select layer for 5 unique synergies with 3 routes each for flx_1,
# flx_2, ext_1, ext_2 and 1 route for ext_3.
# Use with pattern_formation: limbs28_lumbar3/flxext.
# Route indices: flx_1 [0, 1, 2], flx_2 [3, 4, 5], ext_1 [6, 7, 8], ext_2 [9, 10, 11], ext_3 [12].
# 1. Local RG->synergy init to 1.0 for each RG unit's own routes, 0.01 to the other unit of the same
#    phase: flx -> flx_1, flx2 -> flx_2, ext -> ext_1, ext2 -> ext_2 and ext_3 (the wrist/toe
#    synergy): rgF>F, rgH>H
# 2. Flx RG units weakly inhibit ext synergies and vice versa (-0.01), sign-constrained.
# 3. All limb RG->lumbarE init to 0.01 with no sign constraint: rgF>Le, rgH>Le
# 4. All limb RG->lumbarBT init to 0.01 with no sign constraint: rgF>Lbt(c), rgH>Lbt(c)
_target_: utils.torch.block.block_initializer
weight_init:
  rgF>F:  # e.g. Front limb RG to same front limb synergy
    - [flx, [0, 1, 2], 1.0]
    - [flx, [3, 4, 5], 0.01]
    - [flx2, [0, 1, 2], 0.01]
    - [flx2, [3, 4, 5], 1.0]
    - [ext, [6, 7, 8], 1.0]
    - [ext, [9, 10, 11, 12], 0.01]
    - [ext2, [6, 7, 8], 0.01]
    - [ext2, [9, 10, 11, 12], 1.0]
    # flx inhibits ext synergies
    - [flx, [6, 7, 8, 9, 10, 11, 12], -0.01]
    - [flx2, [6, 7, 8, 9, 10, 11, 12], -0.01]
    # ext inhibits flx synergies
    - [ext, [0, 1, 2, 3, 4, 5], -0.01]
    - [ext2, [0, 1, 2, 3, 4, 5], -0.01]
    - sign
  rgH>H:
    - [flx, [0, 1, 2], 1.0]
    - [flx, [3, 4, 5], 0.01]
    - [flx2, [0, 1, 2], 0.01]
    - [flx2, [3, 4, 5], 1.0]
    - [ext, [6, 7, 8], 1.0]
    - [ext, [9, 10, 11, 12], 0.01]
    - [ext2, [6, 7, 8], 0.01]
    - [ext2, [9, 10, 11, 12], 1.0]
    # flx inhibits ext synergies
    - [flx, [6, 7, 8, 9, 10, 11, 12], -0.01]
    - [flx2, [6, 7, 8, 9, 10, 11, 12], -0.01]
    # ext inhibits flx synergies
    - [ext, [0, 1, 2, 3, 4, 5], -0.01]
    - [ext2, [0, 1, 2, 3, 4, 5], -0.01]
    - sign
  # Allow all limb RG units to connect to all lumbar synergies. In contrast to local
  # limb RG->synergy connections, we do not enforce sign, because we don't know how lumbar should
  # be influenced by limb RGs.
  rgF>Le:
    - [[flx, ext, flx2, ext2], null, 0.01]  # null: every synergy.
    - sparse
  rgH>Le:
    - [[flx, ext, flx2, ext2], null, 0.01]  # null: every synergy.
    - sparse
  rgF>Lbt:
    - [[flx, ext, flx2, ext2], null, 0.01]  # null: every synergy.
    - sparse
  rgF>Lbtc:
    - [[flx, ext, flx2, ext2], null, 0.01]  # null: every synergy.
    - sparse
  rgH>Lbt:
    - [[flx, ext, flx2, ext2], null, 0.01]  # null: every synergy.
    - sparse
  rgH>Lbtc:
    - [[flx, ext, flx2, ext2], null, 0.01]  # null: every synergy.
    - sparse

  # No weight init for AF>PF.
initializers:
  sparse:
    _target_: models.constrain
    _partial_: true
    zero: true
  positive:
    _target_: models.constrain
    _partial_: true
    min: 0.0
  negative:
    _target_: models.constrain
    _partial_: true
    max: 0.0
  sign:
    _target_: models.constrain
    _partial_: true
    sign: true
