# @package _global_
# Locomotion across target speeds on randomly generated bumpy terrain, for the NCAP and the two MLPs
# (`tested`). Every rollout regenerates the terrain, which all environments within that rollout
# share.
hydra:
  sweeper:
    params:
      arena.bump_height: 0.0, 0.005, 0.01, 0.015, 0.02, 0.025, 0.03, 0.035, 0.04
      tested: ncap, mlp_es, mlp_ppo
      checkpoint_seed: 1

defaults:
  - /2_test/0_base
  - override /arena: bumps
  - _self_

tested: ncap
# The checkpoint of each model.
models:
  ncap: 1_4_flxext
  mlp_es: 4_1_mlp_es_flxext
  mlp_ppo: 4_3_mlp_ppo_flxext
checkpoint_config: ${models.${tested}}

rollouts: 4
population: 32

arena:
  size: [6, 6]
  bump_height: 0.01
  bump_scale: 0.05
  resolution: 50

task:
  stand_time: 0.09

# The subtasks are the base's: the training task's (pose reward at 0 m/s).

rollout_kwargs:
  duration: 6.0
