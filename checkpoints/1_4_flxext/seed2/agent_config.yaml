    _target_: models.RhythmGenerationCircuit
    flx_delays:
    - 0.25
    - 0.0
    - 0.2
    - 0.0
    ext_oscillator: false
    init:
      _target_: models.init_rg_rat
      _partial_: true
      grad: false
      scale: 0.8
  brainstem_command:
    _target_: models.BrainstemCommandNetwork
    commands:
    - speed
    init:
      _target_: models.init_bc_fixed
      _partial_: true
      weight: 1.0
      bias: 0.0
      weight_grad: false
      bias_grad: false
    repeat: 1
  constrainer:
    _target_: models.Constrainer
  observation_rectifier:
