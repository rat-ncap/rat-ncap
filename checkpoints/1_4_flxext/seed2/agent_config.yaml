      - limbFL
      - limbFR
      H:
      - limbHL
      - limbHR
      Lbt:
      - lumbarBT[<-]
      - lumbarBT[->]
    sagittal_segments:
      Le: lumbarE
      BCs: bc
    transverse_segments:
      Lbt: lumbarBT
    action_synergies:
      limbFL:
      - limbFL
      limbFR:
      - limbFR
      limbHL:
      - limbHL
      limbHR:
      - limbHR
      lumbarE:
      - lumbarE
      lumbarBT:
      - lumbarBT[<-]
      - lumbarBT[->]
    observation_prefix_shorthand:
      rg: rg
      body/proprio_pos: pos
      body/proprio_vel: vel
      body/proprio_trq: trq
      body/tactile: tac
      speed: speed
    action_prefix_shorthand:
      body/muscle_flx: flx
      body/muscle_ext: ext
    action_prefix_symmetry_mapping:
      body/muscle_flx: act
      body/muscle_ext: act
    action_symmetry_mapping:
      body/muscle_flx_lumbarBT: act_Lbt
      body/muscle_ext_lumbarBT: act_Lbt
    synergies:
      F_flx_1:
