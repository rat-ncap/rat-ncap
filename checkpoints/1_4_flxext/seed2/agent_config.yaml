_target_: tonic.torch.agents.ES
model:
  _target_: models.ncap_es
  afferent_feedback:
    _target_: models.AfferentFeedbackNetwork
    observation_prefixes:
      limbFL:
      - body/proprio_pos
      - body/proprio_vel
      - body/proprio_trq
      - body/tactile
      limbFR:
      - body/proprio_pos
      - body/proprio_vel
      - body/proprio_trq
      - body/tactile
      limbHL:
      - body/proprio_pos
      - body/proprio_vel
      - body/proprio_trq
      - body/tactile
      limbHR:
      - body/proprio_pos
      - body/proprio_vel
      - body/proprio_trq
      - body/tactile
      lumbarE:
      - body/proprio_pos
      - body/proprio_vel
      - body/proprio_trq
      lumbarBT[<-]:
      - body/proprio_pos
      - body/proprio_vel
      - body/proprio_trq
      lumbarBT[->]:
      - body/proprio_pos
      - body/proprio_vel
      - body/proprio_trq
    action_segments:
    - limbFL
    - limbFR
    - limbHL
    - limbHR
    lateral_segments:
      F:
      - limbFL
      - limbFR
      H:
      - limbHL
      - limbHR
      Lbt:
      - lumbarBT[<-]
      - lumbarBT[->]
    sagittal_segments:
      Le: lumbarE
    transverse_segments:
      Lbt: lumbarBT
    action_prefixes:
    - flx
    - ext
    observation_prefix_shorthand:
      body/proprio_pos: pos
      body/proprio_vel: vel
      body/proprio_trq: trq
      body/tactile: tac
    reset: true
    reset_weight_id_override:
      _target_: utils.collections.GlobDict
      '*F>Fc': 0
      '*H>Hc': 0
      '*F>H': 0
      '*H>F': 0
      '*F>Hc': 0
      '*H>Fc': 0
      '*F>Le': 0
      '*H>Le': 0
      '*Le>F': 0
      '*Le>H': 0
      '*F>Lbt': 0
      '*H>Lbt': 0
      '*F>Lbtc': 0
      '*H>Lbtc': 0
      '*Lbt>F': 0
      '*Lbt>H': 0
      '*Lbt>Fc': 0
      '*Lbt>Hc': 0
    sensor_activation:
      _target_: torch.nn.Hardtanh
      _partial_: true
      min_val: 0.0
      max_val: 1.0
    reset_activation:
      _target_: torch.nn.Hardtanh
      _partial_: true
      min_val: -1.0
      max_val: 1.0
    on_initialize_sensor:
      _target_: utils.torch.block.block_initializer
      weight_init:
        '*': []
      bias_init:
        '*':
        - negative
      initializers:
        negative:
          _target_: models.constrain
          _partial_: true
          max: 0.0
    on_initialize_reset:
      _target_: utils.torch.block.block_initializer
      weight_init: {}
      bias_init:
        '*':
        - negative
      initializers:
        negative:
          _target_: models.constrain
          _partial_: true
          max: 0.0
  pattern_formation:
    _target_: models.SynergyPatternFormationNetwork
    observation_prefixes:
      bc:
      - speed
      limbFL:
      - rg
      - body/proprio_pos
      - body/proprio_vel
      - body/proprio_trq
      - body/tactile
      limbFR:
