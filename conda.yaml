# Conda environment for Linux with an NVIDIA GPU (CUDA 12). The pip wheels of JAX and PyTorch bring
# their own CUDA libraries. Versions are pinned because the code relies on internals of MJX, Equinox
# and PyTorch.
name: rat-ncap
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - ffmpeg  # Video encoding for `mediapy`.
  - libegl  # Rendering on a GPU (`MUJOCO_GL=egl`).
  - mesalib=25.0.2  # Rendering on a CPU (`MUJOCO_GL=osmesa`); Mesa 25.1 removed OSMesa.
  - pip:
      # Simulation.
      - jax[cuda12]==0.9.0.1
      - mujoco==3.12.0
      - mujoco-mjx[warp]==3.12.0
      - warp-lang==1.16.0
      - equinox==0.13.0
      - jaxtyping==0.3.11
      - wadler-lindig==0.1.7
      # Models and training.
      - torch==2.10.0
      - gymnasium==1.2.3
      - dm-env==1.6
      # Configs and launching.
      - hydra-core==1.3.1
      - omegaconf==2.3.1
      - hydra-submitit-launcher==1.2.0
      - submitit==1.5.4
      # Data and utilities.
      - numpy==2.3.5
      - scipy==1.16.3
      - pandas==2.3.3
      - pyyaml==6.0.3
      - dill==0.4.0
      - psutil==7.2.2
      - tqdm==4.67.1
      # Notebooks and plots.
      - matplotlib==3.10.8
      - mediapy==1.1.8
      - ipykernel==7.4.0
      - nbconvert==7.17.1
      # Tests.
      - pytest==9.1.1
